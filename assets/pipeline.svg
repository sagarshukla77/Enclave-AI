<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 260" width="1200" height="260" role="img" aria-label="Agent pipeline animation" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bar" x1="0" x2="1"><stop offset="0" stop-color="#22d3ee"/><stop offset="1" stop-color="#f472b6"/></linearGradient>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0L8 4L0 8z" fill="#64748b"/></marker>
  </defs>
  <rect width="1200" height="260" rx="16" fill="#0b1020"/>
  <text x="600" y="34" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" fill="#e2e8f0">How one question flows through Enclave AI</text>

  <!-- track -->
  <path id="track" d="M90 130 H1110" stroke="#334155" stroke-width="3" stroke-dasharray="6 8" marker-end="url(#arr)">
    <animate attributeName="stroke-dashoffset" values="0;-28" dur="1s" repeatCount="indefinite"/>
  </path>

  <g font-family="Segoe UI, Arial, sans-serif" text-anchor="middle">
    <!-- nodes -->
    <g><rect x="30"  y="95" width="120" height="70" rx="12" fill="#111a33" stroke="#22d3ee"/><text x="90"  y="125" font-size="26">💬</text><text x="90"  y="153" font-size="13" fill="#cbd5e1">Question</text></g>
    <g><rect x="215" y="95" width="120" height="70" rx="12" fill="#111a33" stroke="#818cf8"/><text x="275" y="125" font-size="26">🧭</text><text x="275" y="153" font-size="13" fill="#cbd5e1">Classify</text></g>
    <g><rect x="400" y="95" width="120" height="70" rx="12" fill="#111a33" stroke="#818cf8"/><text x="460" y="125" font-size="26">📚</text><text x="460" y="153" font-size="13" fill="#cbd5e1">Retrieve (RAG)</text></g>
    <g><rect x="585" y="95" width="120" height="70" rx="12" fill="#111a33" stroke="#818cf8"/><text x="645" y="125" font-size="26">🛠️</text><text x="645" y="153" font-size="13" fill="#cbd5e1">Use Tools</text></g>
    <g><rect x="770" y="95" width="120" height="70" rx="12" fill="#111a33" stroke="#818cf8"/><text x="830" y="125" font-size="26">🧠</text><text x="830" y="153" font-size="13" fill="#cbd5e1">Draft (local LLM)</text></g>
    <g><rect x="955" y="95" width="120" height="70" rx="12" fill="#111a33" stroke="#f472b6"/><text x="1015" y="125" font-size="26">✅</text><text x="1015" y="153" font-size="13" fill="#cbd5e1">Validate</text></g>
    <text x="1140" y="125" font-size="28">📄</text><text x="1140" y="153" font-size="13" fill="#cbd5e1">Report</text>

    <!-- highlight sweeping across nodes -->
    <rect x="30" y="95" width="120" height="70" rx="12" fill="none" stroke="#fff" stroke-width="3" opacity=".9">
      <animate attributeName="x" values="30;215;400;585;770;955;955" keyTimes="0;.17;.34;.5;.67;.84;1" calcMode="discrete" dur="6s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- data packet -->
  <circle r="9" fill="url(#bar)">
    <animateMotion dur="6s" repeatCount="indefinite" path="M90 130 H1110"/>
  </circle>

  <!-- audit rail -->
  <rect x="30" y="195" width="1090" height="8" rx="4" fill="#1e293b"/>
  <rect x="30" y="195" width="0" height="8" rx="4" fill="url(#bar)"><animate attributeName="width" values="0;1090" dur="6s" repeatCount="indefinite"/></rect>
  <text x="600" y="228" text-anchor="middle" font-family="Consolas, monospace" font-size="14" fill="#94a3b8">📝 audit log records every step — timestamp · user · sources · tools · answer</text>
</svg>
