services:
  app:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      OLLAMA_URL: http://ollama:11434
      DATA_DIR: /app/backend/data
      DB_PATH: /app/backend/data/workbench.db
      CORS_ORIGINS: ""
    volumes:
      - enclave_data:/app/backend/data
    depends_on:
      ollama:
        condition: service_healthy

  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      DEPLOY_DOMAIN: ${DEPLOY_DOMAIN:?Set DEPLOY_DOMAIN in the project .env file}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

volumes:
  enclave_data:
  ollama_data:
  caddy_data:
  caddy_config:

